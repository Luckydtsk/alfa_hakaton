<script>
'use strict';
const KEY='alfa-finance-prototype-v1';
const money=n=>new Intl.NumberFormat('ru-RU',{style:'currency',currency:'RUB',maximumFractionDigits:0}).format(n);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initial=()=>({apps:[{id:1042,goal:'Купить оборудование',amount:3000000,term:36,product:'equipment',status:'approved',date:'24 октября 2026',comment:'Заявка одобрена. Вы можете ознакомиться с документами и продолжить оформление.'},{id:1041,goal:'Закупить материалы',amount:850000,term:12,product:'working_capital',status:'need_info',date:'23 октября 2026',comment:'Укажите число сотрудников, чтобы продолжить рассмотрение заявки.'}],reserve:{active:false,limit:500000,debt:0,own:80000,events:[]}});
let state;try{state=JSON.parse(localStorage.getItem(KEY))||initial();if(!Array.isArray(state.apps)||!state.reserve)state=initial()}catch{state=initial()}
let draft={step:1,taskText:'',goal:'development',amount:3000000,term:36,inn:'7701000006',name:'ООО «Тихая мастерская»',type:'ООО',age:'Больше 5 лет',jobs:8,industry:'Производство',collateral:true,consent:false};
state.profile??={inn:'7701000006',name:'ООО «Тихая мастерская»',industry:'Производство'};
let newsIndex=0,newsTimer=null,newsPaused=false;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch{toast('Браузер не сохранил данные. В этой вкладке изменения доступны до перезагрузки.')}};
const statusNames={approved:'Одобрена',need_info:'Нужны данные',counteroffer:'Другие условия',manual_review:'На рассмотрении',rejected:'Отказ',documents_ready:'Документы готовы',funded:'Выдача смоделирована'};
const tag=s=>`<span class="tag ${['approved','funded','documents_ready'].includes(s)?'green':s==='rejected'?'red':'amber'}"><span class="dot"></span>${statusNames[s]||esc(s)}</span>`;
const btn=(label,action,kind='',extra='')=>`<button class="button ${kind}" data-action="${action}" ${extra}>${label}</button>`;
function toast(t){const e=document.getElementById('toast');e.textContent=t;clearTimeout(toast.timer);toast.timer=setTimeout(()=>e.textContent='',4500)}
const footer=()=>`<footer class="footer"><span>Учебный прототип · Условия примерные, операции смоделированы</span><div class="row"><button data-action="bank">Кабинет сотрудника</button><button data-action="about">О макете</button><button data-action="reset">Сбросить демо</button></div></footer>`;
const heading=(title,description='',action='')=>`<div class="heading"><div><h1>${title}</h1>${description?`<p>${description}</p>`:''}</div>${action}</div>`;
const appRow=a=>`<button class="list-row" data-action="case:${a.id}"><div><h3>${esc(a.goal)}</h3><span class="small muted">Заявка № ${a.id} · ${a.date}</span></div><div class="amount-col"><b>${money(a.amount)}</b><div class="small muted">${a.term} месяцев</div></div>${tag(a.status)}<span class="arrow" aria-hidden="true">›</span></button>`;
function go(route){if(location.hash==='#'+route)render();else location.hash=route}

function newsItems(){
 const manufacturing=state.profile.industry==='Производство',active=state.reserve.active;
 const equipment={key:'equipment',label:'КРЕДИТ НА ОБОРУДОВАНИЕ',title:manufacturing?'Новое оборудование — новые возможности':'Инвестируйте в следующий шаг бизнеса',text:'Станки, техника и оснащение. Рассмотрите финансирование покупки, сохранив деньги на текущие расходы.',metric:'До 20 млн ₽',detail:'До 36 месяцев · с залогом',action:'goal:development',cta:'Рассмотреть кредит',reason:manufacturing?'Показываем для производственной компании из вашего профиля.':'Может подойти для оснащения и расширения бизнеса.'};
 const working={key:'working',label:'ОБОРОТНЫЙ КРЕДИТ',title:state.profile.industry==='Розничная торговля'?'Пополните запасы к новому сезону':'Закупки сегодня. Возможности завтра.',text:'На товар, материалы и текущие расходы. Выберите сумму и срок под ближайшие задачи компании.',metric:'До 5 млн ₽',detail:'До 12 месяцев · без обязательного залога',action:'goal:urgent',cta:'Посмотреть условия',reason:state.profile.industry==='Розничная торговля'?'Показываем для розничной компании из вашего профиля.':'Для финансирования текущих расходов компании.'};
 const reserve={key:'reserve',label:active?'ВАШ РЕЗЕРВ НА ПЛАТЕЖИ':'РЕЗЕРВ НА ПЛАТЕЖИ',title:active?'Резерв готов подстраховать ваши платежи':'Поступления задержались. Платежи — нет.',text:active?'Если собственных средств не хватит, используйте доступный лимит по уже подключённому договору.':'Подключите резерв заранее. Он автоматически покроет недостающую часть платежа в пределах доступного лимита.',metric:active?money(state.reserve.limit-state.reserve.debt):'Оформите заранее',detail:active?'Доступный резерв по учебному договору':'Один договор · повторное использование',action:'reserve',cta:active?'Открыть резерв':'Как работает резерв',reason:active?'Вы уже подключили резерв — показываем его текущий остаток.':'Подстраховка текущих платежей при кассовом разрыве.'};
 return manufacturing?[equipment,working,reserve]:[working,equipment,reserve];
}
function newsSlide(){const items=newsItems(),n=items[newsIndex%items.length];return `<div><span class="eyebrow muted">${n.label}</span><h2>${n.title}</h2><p>${n.text}</p>${btn(n.cta+' <span aria-hidden="true">→</span>',n.action)}<p class="news-reason">${n.reason}</p></div><div class="news-aside"><span class="small muted">${n.key==='reserve'&&state.reserve.active?'Доступно сейчас':'Пример продукта'}</span><div class="amount">${n.metric}</div><p>${n.detail}</p><p class="small muted" style="margin-top:18px">Демонстрационное предложение. Доступность и окончательные условия определяются после рассмотрения заявки.</p></div>`}
function newsCarousel(){return `<section class="news" id="news-carousel" aria-roledescription="карусель" aria-label="Предложения для вашей компании"><div class="news-top"><span class="eyebrow">Для вашего бизнеса</span></div><div class="news-slide" id="news-slide" role="group" aria-roledescription="слайд" aria-label="Предложение ${newsIndex+1} из 3">${newsSlide()}</div><button class="news-arrow prev" data-action="news-prev" aria-label="Предыдущее предложение">‹</button><button class="news-arrow next" data-action="news-next" aria-label="Следующее предложение">›</button><div class="news-bottom"><div class="row"><div class="news-dots" aria-label="Выбрать предложение">${newsItems().map((n,i)=>`<button data-action="news-index:${i}" class="${i===newsIndex?'current':''}" aria-label="Предложение ${i+1}: ${n.label}" aria-current="${i===newsIndex?'true':'false'}"></button>`).join('')}</div><span class="small muted" id="news-count">${newsIndex+1} / 3</span></div>${btn(newsPaused?'Продолжить смену':'Пауза','news-pause','text','aria-label="'+(newsPaused?'Продолжить автоматическую смену предложений':'Приостановить автоматическую смену предложений')+'"')}</div></section>`}
function updateNews(){const slide=document.getElementById('news-slide');if(!slide)return;slide.innerHTML=newsSlide();slide.setAttribute('aria-label',`Предложение ${newsIndex+1} из 3`);document.getElementById('news-count').textContent=`${newsIndex+1} / 3`;document.querySelectorAll('.news-dots button').forEach((e,i)=>{e.classList.toggle('current',i===newsIndex);e.setAttribute('aria-current',i===newsIndex?'true':'false')})}
function startNews(){clearInterval(newsTimer);newsTimer=null;if(newsPaused||!document.getElementById('news-carousel'))return;newsTimer=setInterval(()=>{const carousel=document.getElementById('news-carousel');if(!carousel||document.hidden||carousel.contains(document.activeElement))return;newsIndex=(newsIndex+1)%newsItems().length;updateNews()},10000)}
function moveNews(delta){newsIndex=(newsIndex+delta+newsItems().length)%newsItems().length;updateNews();startNews()}
function profileModal(){showModal('О компании',`<p>В рабочем кабинете эти сведения заполняются при регистрации. Здесь можно изменить тестовый профиль и посмотреть, как меняются предложения.</p><form id="profile-form" class="stack" style="margin-top:24px"><label class="field">Название компании<input name="name" required maxlength="120" value="${esc(state.profile.name)}"></label><label class="field">ИНН<input name="inn" required pattern="(?:[0-9]{10}|[0-9]{12})" inputmode="numeric" value="${esc(state.profile.inn)}"></label><label class="field">Отрасль<select name="industry">${['Производство','Розничная торговля','Кафе и гостиницы','Профессиональные услуги и IT','Другая отрасль'].map(v=>`<option ${v===state.profile.industry?'selected':''}>${v}</option>`).join('')}</select></label><label class="field">Форма бизнеса<select name="type">${['ООО','ИП'].map(v=>`<option ${v===state.profile.type?'selected':''}>${v}</option>`).join('')}</select></label><label class="field">Возраст бизнеса<select name="age">${['Больше 5 лет','От 2 до 5 лет','Меньше 2 лет','Бизнес только открывается'].map(v=>`<option ${v===state.profile.age?'selected':''}>${v}</option>`).join('')}</select></label><label class="field">Число сотрудников<input name="jobs" type="number" min="0" max="100000" step="1" required value="${esc(state.profile.jobs)}"></label><p class="small muted">Предложения в демо упорядочены по отрасли и наличию активного резерва. Один ИНН сам по себе не определяет кредитный лимит.</p><button class="button" type="submit">Сохранить профиль</button></form>`)}

function home(){return heading('Финансирование','Для текущих задач и новых возможностей вашего бизнеса.')+`${newsCarousel()}<section><div class="section-head"><h2>Какая задача у бизнеса?</h2><span class="small muted">Начните с того, что нужно вам</span></div><div class="choices"><button class="choice" data-action="goal:urgent"><span class="choice-num">01 / ТЕКУЩИЕ РАСХОДЫ</span><h3>Оплатить срочную закупку</h3><p>Когда нужно рассчитаться с поставщиком или пополнить запасы.</p><span class="link">Подобрать решение →</span></button><button class="choice" data-action="goal:development"><span class="choice-num">02 / РАЗВИТИЕ</span><h3>Вложиться в развитие</h3><p>Оборудование, ремонт или расширение — без изъятия денег из оборота.</p><span class="link">Посмотреть условия →</span></button><button class="choice" data-action="reserve"><span class="choice-num">03 / КАССОВЫЙ РАЗРЫВ</span><h3>Подключить резерв</h3><p>Автоматически покрывать нехватку денег на текущие платежи.</p><span class="link">Подробнее →</span></button></div></section><section class="section"><div class="section-head"><h2>Ваши заявки</h2>${btn('Все заявки →','applications','text')}</div><div class="list">${state.apps.slice(0,2).map(appRow).join('')}</div></section>`}
function applications(){return heading('Мои заявки','Все решения и следующие действия — здесь.',btn('Новая заявка','new'))+`<div class="list">${state.apps.map(appRow).join('')}</div>`}
function estimate(amount,term){const rate=.18/12;const payment=amount*rate/(1-Math.pow(1+rate,-term));return {payment:Math.round(payment),cost:Math.round(payment*term-amount)}}
function picker(){const d=draft;for(const key of ['inn','name','type','age','jobs','industry'])d[key]=state.profile[key];const equipment=d.goal==='development',e=estimate(Number(d.amount)||0,Number(d.term));const steps=['Задача и условия','Проверка и отправка'];let form='';
if(d.step===1)form=`<h2 style="margin-bottom:24px">На что нужны деньги?</h2><div class="form-grid"><label class="field full">Для чего нужны деньги?<textarea class="task-input" name="taskText" rows="3" required maxlength="1000" placeholder="Например, купить станок за 800 тысяч или закупить товар к сезону">${esc(d.taskText)}</textarea><span class="hint">Опишите задачу своими словами</span></label><div class="field full"><span>Кредитный продукт</span><div class="product-options" role="group" aria-label="Кредитный продукт"><button type="button" class="${equipment?'selected':''}" aria-pressed="${equipment}" data-action="product:development">На оборудование</button><button type="button" class="${!equipment?'selected':''}" aria-pressed="${!equipment}" data-action="product:urgent">Оборотный кредит</button></div></div><label class="field full">Сумма<input name="amount" type="number" min="10000" max="20000000" step="10000" required value="${d.amount}"><span class="hint">От 10 000 до 20 000 000 ₽ в этом примере</span></label><div class="field full"><span>Срок финансирования</span><div class="segments" role="group" aria-label="Срок финансирования">${[12,24,36].map(t=>`<button type="button" aria-pressed="${d.term===t}" class="${d.term===t?'selected':''}" data-action="term:${t}">${t} мес.</button>`).join('')}</div></div></div>${equipment?`<label class="check" style="margin-top:24px"><input type="checkbox" name="collateral" ${d.collateral?'checked':''}>Есть имущество, которое можно предоставить в залог</label>`:''}<div class="note" style="margin-top:24px">${equipment?'Выбран кредит на оборудование. Для него потребуется залог.':'Выбран оборотный кредит. В примере лимит продукта — 5 млн ₽ на срок до 12 месяцев.'}</div>`;
if(d.step===2)form=`<h2 style="margin-bottom:12px">Проверьте заявку</h2><p class="small muted" style="margin-bottom:24px">Данные компании уже заполнены из вашего профиля.</p><dl class="facts"><div><dt>Компания</dt><dd>${esc(d.name)}</dd></div><div><dt>ИНН</dt><dd>${esc(d.inn)}</dd></div><div><dt>Задача</dt><dd style="max-width:70%;overflow-wrap:anywhere">${esc(d.taskText)}</dd></div><div><dt>Продукт</dt><dd>${equipment?'Кредит на оборудование':'Оборотный кредит'}</dd></div><div><dt>Сумма и срок</dt><dd>${money(d.amount)} · ${d.term} мес.</dd></div><div><dt>Форма бизнеса</dt><dd>${esc(d.type)}</dd></div><div><dt>Возраст бизнеса</dt><dd>${esc(d.age)}</dd></div><div><dt>Отрасль</dt><dd>${esc(d.industry)}</dd></div><div><dt>Сотрудники</dt><dd>${d.jobs===''?'Нужно дополнить':esc(d.jobs)}</dd></div></dl><label class="check" style="margin-top:30px"><input type="checkbox" name="consent" required ${d.consent?'checked':''}>Согласен на обработку данных и запрос кредитной истории для рассмотрения заявки</label><div class="note" style="margin-top:22px">В прототипе используются тестовые данные. Проверки и решение смоделированы; запросы в БКИ не отправляются.</div>`;
return `<button class="back" data-action="home">← Финансирование</button>`+heading('Подберём финансирование','Понятные условия — до отправки заявки.')+`<div class="stepper">${steps.map((s,i)=>`<span class="${d.step===i+1?'current':''}"><b>${i+1}</b>${s}</span>`).join('')}</div><div class="two-col"><form id="application-form">${form}<div class="form-actions">${d.step>1?btn('Назад','prev','secondary','type="button"'):'<span class="small muted">Шаг 1 из 2</span>'}<button class="button" type="submit">${d.step===2?'Отправить заявку':'Продолжить'} →</button></div></form><div class="panel"><span class="eyebrow muted">Пример расчёта</span><h3 style="margin-top:16px">${equipment?'Кредит на оборудование':'Оборотный кредит'}</h3><p class="small muted">${equipment?'На приобретение оборудования, с залогом.':'На закупки и текущие расходы.'}</p><div class="amount" style="margin:24px 0 6px" id="estimate-payment">${money(e.payment)}</div><p class="small muted">Примерный ежемесячный платёж</p><dl class="facts" style="margin-top:24px"><div><dt>Ставка в примере</dt><dd>18% годовых</dd></div><div><dt>Проценты за срок</dt><dd id="estimate-cost">${money(e.cost)}</dd></div><div><dt>Комиссии в примере</dt><dd>0 ₽</dd></div></dl><p class="small muted" style="margin-top:24px">Учебный расчёт по аннуитетной схеме, не тариф банка и не одобрение. Финальные условия должны прийти от сервиса решения.</p></div></div>`}
function appCase(id){const a=state.apps.find(a=>a.id===id);if(!a)return heading('Заявка не найдена')+btn('К заявкам','applications');let action='',title='',body=a.comment;
if(a.status==='approved'){title='Финансирование одобрено';action=btn('Ознакомиться с документами','prepare:'+id)}
if(a.status==='need_info'){title='Нужно немного больше информации';action=`<form id="supplement-form" data-id="${id}" style="margin-top:24px"><label class="field" style="max-width:300px">Число сотрудников<input name="jobs" type="number" min="0" max="100000" step="1" required></label><button class="button" style="margin-top:16px" type="submit">Отправить данные</button></form>`}
if(a.status==='counteroffer'){title='Можем предложить другие условия';body='Запрошенные сумма или срок превышают лимит оборотного продукта. Сравните условия перед принятием.';action=`<div class="comparison"><div><span class="small muted">Вы запросили</span><div class="amount">${money(a.amount)}</div><span class="small">${a.term} мес.</span></div><div><span class="small muted">Предложение в демо</span><div class="amount">${money(Math.min(a.amount,5000000))}</div><span class="small">${Math.min(a.term,12)} мес.</span></div></div><div class="row">${btn('Принять условия','accept:'+id)}${btn('Отказаться','decline:'+id,'secondary')}</div>`}
if(a.status==='manual_review'){title='Заявка у сотрудника банка';body='Сотрудник изучит сведения и сообщит решение в этой карточке. Дополнительных действий сейчас не требуется.'}
if(a.status==='documents_ready'){title='Документы готовы к ознакомлению';body='Проверьте условия договора и примерный график. Следующее действие моделирует подписание и выдачу.';action=`<div class="row">${btn('Прочитать договор','contract:'+id,'secondary')}${btn('Подписать и получить деньги','fund:'+id)}</div>`}

const stage=a.status==='funded'?4:a.status==='documents_ready'?3:2;

function bank(){const queue=state.apps.filter(a=>a.status==='manual_review');return heading('Заявки на рассмотрении','Рабочее место сотрудника · Демонстрационный режим',btn('Вернуться в кабинет клиента','home','secondary'))+`<div class="note">Для проверки очереди можно отправить заявку, указав отрасль «Кафе и гостиницы». В этом прототипе она направляется сотруднику по демонстрационному правилу.</div><section class="section"><h2>Ожидают решения <span class="muted">${queue.length}</span></h2>${queue.length?`<div class="list">${queue.map(a=>`<div style="padding:24px 0;border-bottom:1px solid var(--line)"><div class="spread"><div><h3>${esc(a.name||'ООО «Тихая мастерская»')}</h3><p class="small muted">№ ${a.id} · ${money(a.amount)} · ${a.term} мес.</p></div>${tag(a.status)}</div><form class="bank-form stack" data-id="${a.id}" style="margin-top:20px"><label class="field">Решение<select name="decision"><option value="approved">Одобрить</option><option value="need_info">Запросить данные</option><option value="rejected">Отказать</option></select></label><label class="field">Комментарий клиенту<textarea name="comment" required maxlength="1000" rows="2"></textarea></label><button class="button" style="justify-self:start">Сохранить решение</button></form></div>`).join('')}</div>`:'<p class="empty">Все заявки разобраны. Новые обращения появятся здесь.</p>'}</section>`}
function render(){clearInterval(newsTimer);state.profile={type:'ООО',age:'Больше 5 лет',jobs:8,...state.profile};document.querySelector('.company .name').textContent=state.profile.name;const route=(location.hash.slice(1)||'home').split('/');document.getElementById('app-count').textContent=state.apps.length;document.querySelectorAll('[data-nav]').forEach(e=>{const selected=e.dataset.nav===route[0]||(route[0]==='case'&&e.dataset.nav==='applications')||(route[0]==='new'&&e.dataset.nav==='home');e.classList.toggle('active',selected);if(selected)e.setAttribute('aria-current','page');else e.removeAttribute('aria-current')});let html;switch(route[0]){case'home':html=home();break;case'new':html=picker();break;case'applications':html=applications();break;case'case':html=appCase(Number(route[1]));break;case'reserve':html=reserve();break;case'documents':html=documents();break;case'bank':html=bank();break;default:html=heading('Страница не найдена')+btn('На главную','home')}document.getElementById('main').innerHTML=html+footer();document.title=(route[0]==='reserve'?'Резерв на платежи':'Финансирование')+' · Альфа - Бузинесс';startNews()}
function captureDraft(){const f=document.getElementById('application-form');if(!f)return;for(const [k,v]of new FormData(f)){if(k==='collateral'||k==='consent')continue;draft[k]=['amount','jobs'].includes(k)?(v===''?'':Number(v)):v}if(f.elements.collateral)draft.collateral=f.elements.collateral.checked;if(f.elements.consent)draft.consent=f.elements.consent.checked}

function contract(id){if(id==='reserve')return `УЧЕБНЫЙ ОБРАЗЕЦ. Не является действующим договором.\n\nРезерв на платежи № Р-2026/104\nЛимит: 500 000 ₽. Ставка примера: 18% годовых. Комиссии: 0 ₽.\nСрок действия: до 24 октября 2027.\nСрок возврата каждого использования: не более 30 дней.\nПри нехватке собственных средств платёж использует доступный резерв.\nПоступления направляются на погашение задолженности; лимит восстанавливается на сумму погашенного основного долга.\nВ демонстрации операции происходят в один день, начисленные проценты равны 0 ₽. В полноценном продукте стоимость зависит от суммы и времени использования.\nВсе денежные операции смоделированы.`;const a=state.apps.find(a=>a.id===Number(id));if(!a)return'';const e=estimate(a.amount,a.term);return `УЧЕБНЫЙ ОБРАЗЕЦ. Не является действующим договором.\n\nДоговор финансирования № ${a.id}\nКомпания: ${a.name||'ООО «Тихая мастерская»'}\nСумма: ${money(a.amount)}. Срок: ${a.term} месяцев.\nСтавка примера: 18% годовых. Комиссии: 0 ₽.\nПримерный ежемесячный платёж: ${money(e.payment)}.\nПроценты за срок: ${money(e.cost)}.\nПлатежи рассчитаны по аннуитетной схеме; точный график и финальный платёж определяет сервис расчёта.\nПодписание и выдача в этом макете смоделированы.`}

async function downloadContractPdf(id,button){
 const text=contract(id);if(!text){toast('Документ не найден');return}
 button.disabled=true;const original=button.textContent;button.textContent='Готовим PDF…';
 try{
  const width=1240,height=1754,margin=100,pages=[];let canvas,ctx,y;
  function page(){canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,width,height);ctx.fillStyle='#ef3124';ctx.font='bold 32px Arial';ctx.fillText('Альфа - Бузинесс',margin,100);ctx.fillStyle='#202022';ctx.font='bold 38px Arial';ctx.fillText(id==='reserve'?'Договор резерва на платежи':'Договор финансирования',margin,178);ctx.fillStyle='#717176';ctx.font='22px Arial';ctx.fillText('Учебный образец · 24 октября 2026',margin,221);ctx.fillStyle='#e6e6e9';ctx.fillRect(margin,250,width-margin*2,2);y=302}
  async function finish(){ctx.fillStyle='#717176';ctx.font='20px Arial';ctx.fillText('Все операции смоделированы. Не является действующим договором.',margin,height-100);ctx.fillText(String(pages.length+1),width-margin-20,height-100);const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',.96));if(!blob)throw new Error('Не удалось сформировать страницу');pages.push(new Uint8Array(await blob.arrayBuffer()))}
  page();
  for(const paragraph of text.split('\n')){
   if(!paragraph.trim()){y+=20;continue}
   ctx.font='25px Arial';const lines=[];let line='';
   for(const word of paragraph.split(/\s+/)){const next=line?line+' '+word:word;if(ctx.measureText(next).width>width-margin*2&&line){lines.push(line);line=word}else line=next}if(line)lines.push(line);
   for(const content of lines){if(y>height-180){await finish();page()}ctx.fillStyle='#202022';ctx.font='25px Arial';ctx.fillText(content,margin,y);y+=40}y+=12;
  }
  await finish();
  const enc=new TextEncoder(),chunks=[],offsets=[0];let size=0;
  function append(value){const bytes=typeof value==='string'?enc.encode(value):value;chunks.push(bytes);size+=bytes.length}
  function object(number,content){offsets[number]=size;append(number+' 0 obj\n');append(content);append('\nendobj\n')}
  append('%PDF-1.4\n');
  object(1,'<< /Type /Catalog /Pages 2 0 R >>');
  object(2,'<< /Type /Pages /Count '+pages.length+' /Kids ['+pages.map((_,i)=>(3+i*3)+' 0 R').join(' ')+'] >>');
  pages.forEach((jpg,i)=>{const number=3+i*3;object(number,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Image '+(number+1)+' 0 R >> >> /Contents '+(number+2)+' 0 R >>');offsets[number+1]=size;append((number+1)+' 0 obj\n<< /Type /XObject /Subtype /Image /Width '+width+' /Height '+height+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+jpg.length+' >>\nstream\n');append(jpg);append('\nendstream\nendobj\n');const content='q\n595.28 0 0 841.89 0 0 cm\n/Image Do\nQ\n';object(number+2,'<< /Length '+enc.encode(content).length+' >>\nstream\n'+content+'endstream')});
  const xref=size,count=3+pages.length*3;append('xref\n0 '+count+'\n0000000000 65535 f \n');for(let i=1;i<count;i++)append(String(offsets[i]).padStart(10,'0')+' 00000 n \n');append('trailer\n<< /Size '+count+' /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF');
  const url=URL.createObjectURL(new Blob(chunks,{type:'application/pdf'}));const link=document.createElement('a');link.href=url;link.download='alfa-buziness-dogovor-'+id+'.pdf';link.click();setTimeout(()=>URL.revokeObjectURL(url),10000);
 }catch(error){toast('Не удалось скачать PDF. Попробуйте ещё раз.');console.error(error)}finally{button.disabled=false;button.textContent=original}
}

document.addEventListener('click',event=>{const el=event.target.closest('[data-action]');if(!el)return;const [action,arg]=el.dataset.action.split(':');if(el.tagName==='BUTTON'&&el.getAttribute('type')!=='submit')event.preventDefault();const id=Number(arg),a=state.apps.find(x=>x.id===id);switch(action){case'home':case'applications':case'reserve':case'documents':case'bank':go(action);break;case'new':draft.step=1;draft.inn=state.profile.inn;draft.name=state.profile.name;draft.industry=state.profile.industry;go('new');break;case'product':captureDraft();draft.goal=arg;render();break;case'profile':profileModal();break;case'news-prev':moveNews(-1);break;case'news-next':moveNews(1);break;case'news-index':newsIndex=id;updateNews();startNews();break;case'news-pause':newsPaused=!newsPaused;el.textContent=newsPaused?'Продолжить смену':'Пауза';el.setAttribute('aria-label',newsPaused?'Продолжить автоматическую смену предложений':'Приостановить автоматическую смену предложений');startNews();break;case'goal':draft.goal=arg;draft.taskText=arg==='urgent'?'Закупить товар и материалы':'Купить оборудование для бизнеса';draft.inn=state.profile.inn;draft.name=state.profile.name;draft.industry=state.profile.industry;draft.amount=arg==='urgent'?1500000:3000000;draft.term=arg==='urgent'?12:36;draft.step=1;go('new');break;case'case':go('case/'+arg);break;case'term':captureDraft();draft.term=id;render();break;case'prev':captureDraft();draft.step--;render();break;case'prepare':if(a&&a.status==='approved'){a.status='documents_ready';save();render();toast('Учебный пакет документов подготовлен')}break;case'fund':if(a&&a.status==='documents_ready')showModal('Подписать и смоделировать выдачу',`<p>Сумма финансирования: <b>${money(a.amount)}</b>. Срок: ${a.term} месяцев.</p><p>Это учебная операция. Реальной подписи и перевода денег не будет.</p><label class="check" style="margin-top:20px"><input type="checkbox" id="fund-consent">Я ознакомился с учебными условиями договора</label><div style="margin-top:24px">${btn('Подтвердить','confirm-fund:'+id)}</div>`);break;case'confirm-fund':if(!document.getElementById('fund-consent').checked){toast('Подтвердите ознакомление с условиями');break}if(a&&a.status==='documents_ready'){a.status='funded';save();document.getElementById('modal').close();render();toast('Подписание и выдача смоделированы')}break;case'accept':if(a&&a.status==='counteroffer'){a.amount=Math.min(a.amount,5000000);a.term=Math.min(a.term,12);a.status='approved';a.comment='Вы приняли предложенные условия. Следующий шаг — документы.';save();render()}break;case'decline':if(a&&a.status==='counteroffer'){a.status='rejected';a.comment='Вы отказались от предложенных условий.';save();render()}break;case'contract':contractModal(arg);break;case'reserve-contract':contractModal('reserve');break;case'download':downloadContractPdf(arg,el);break;case'connect':showModal('Подключить резерв на платежи',`<p>Для тестовой компании подготовлены демонстрационные условия. В рабочем продукте перед этим проходит заявка и рассмотрение банком.</p><dl class="facts"><div><dt>Лимит в примере</dt><dd>500 000 ₽</dd></div><div><dt>Ставка в примере</dt><dd>18% годовых</dd></div><div><dt>Максимальный срок долга</dt><dd>30 дней</dd></div><div><dt>Комиссии</dt><dd>0 ₽</dd></div></dl><details style="margin-top:24px"><summary style="cursor:pointer;font-size:14px">Прочитать учебный договор</summary><div class="contract-text" style="margin-top:12px">${esc(contract('reserve'))}</div></details><label class="check" style="margin-top:24px"><input id="reserve-consent" type="checkbox">Принимаю учебные условия и подключаю автоматическое использование резерва при нехватке своих средств</label><div style="margin-top:24px">${btn('Подписать и подключить','activate')}</div>`);break;case'activate':if(!document.getElementById('reserve-consent').checked){toast('Ознакомьтесь с условиями и подтвердите подключение');break}state.reserve.active=true;save();document.getElementById('modal').close();render();toast('Резерв подключён в демонстрационном режиме');break;case'confirm-payment':{const p=window.pendingPayment,r=state.reserve;if(!p||!r.active)break;const fromOwn=Math.min(r.own,p.amount),borrow=p.amount-fromOwn;if(borrow>r.limit-r.debt){toast('Доступная сумма изменилась. Проверьте платёж заново.');document.getElementById('modal').close();break}window.pendingPayment=null;r.own-=fromOwn;r.debt+=borrow;r.events.unshift({kind:'payment',title:'Платёж поставщику',detail:p.recipient,amount:p.amount,reserve:borrow});save();document.getElementById('modal').close();render();toast('Платёж смоделирован. Из резерва использовано '+money(borrow));break}case'close':document.getElementById('modal').close();window.pendingPayment=null;break;case'about':showModal('О наработке интерфейса','<p>Это самостоятельный HTML-прототип кредитного кабинета. Он не подключён к банковским системам или API проекта.</p><p>Визуальное направление опирается на доступную документацию Core Components Альфа-Банка. Макет не является официальным интерфейсом банка; точное соответствие актуальным токенам ещё не проверено.</p><p>Заявки, решения, ставка 18%, резерв и операции — демонстрационные. Данные сохраняются только в этом браузере.</p>');break;case'reset':showModal('Сбросить демонстрационные данные?',`<p>Будут удалены только заявки и операции, созданные в этом HTML-прототипе. Появятся исходные тестовые примеры.</p><div class="row" style="margin-top:24px">${btn('Сбросить','confirm-reset')}${btn('Отмена','close','secondary')}</div>`);break;case'confirm-reset':state=initial();state.profile={inn:'7701000006',name:'ООО «Тихая мастерская»',industry:'Производство'};newsIndex=0;save();document.getElementById('modal').close();go('home');toast('Исходные демоданные восстановлены');break}});
document.addEventListener('change',e=>{if(e.target.form?.id==='application-form'){captureDraft();}});
document.addEventListener('input',e=>{if(e.target.form?.id==='application-form'){captureDraft();if(e.target.name==='amount'){const v=estimate(Number(draft.amount)||0,draft.term);const pay=document.getElementById('estimate-payment'),cost=document.getElementById('estimate-cost');if(pay)pay.textContent=money(v.payment);if(cost)cost.textContent=money(v.cost)}}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;if(!f.reportValidity())return;const data=new FormData(f);if(f.id==='application-form'){captureDraft();if(draft.step<2){draft.step++;render();return}const a={...draft,id:Math.max(...state.apps.map(a=>a.id),1042)+1,goal:draft.taskText.trim(),product:draft.goal==='development'?'equipment':'working_capital',date:'24 октября 2026',comment:'Демонстрационное решение по данным заявки. Ознакомьтесь с результатом и следующим действием.'};a.status=decisionFor(a);state.apps.unshift(a);save();draft.step=1;go('case/'+a.id);toast('Заявка сохранена в прототипе')}else if(f.id==='profile-form'){state.profile={name:String(data.get('name')).trim(),inn:String(data.get('inn')),industry:String(data.get('industry')),type:String(data.get('type')),age:String(data.get('age')),jobs:Number(data.get('jobs'))};save();newsIndex=0;document.getElementById('modal').close();render();toast('Профиль сохранён. Предложения обновлены.')}else if(f.id==='supplement-form'){const a=state.apps.find(a=>a.id===Number(f.dataset.id));if(!a||a.status!=='need_info')return;a.jobs=Number(data.get('jobs'));a.status='manual_review';a.comment='Дополнительные данные получены. Заявка передана сотруднику.';save();render();toast('Данные приняты, заявка направлена сотруднику')}else if(f.id==='payment-form'){const amount=Number(data.get('amount')),r=state.reserve;if(!Number.isSafeInteger(amount)||amount<=0){document.getElementById('payment-error').textContent='Укажите целую положительную сумму.';return}if(amount>r.own+r.limit-r.debt){document.getElementById('payment-error').textContent='Своих средств и доступного резерва недостаточно для этого платежа.';return}document.getElementById('payment-error').textContent='';const own=Math.min(r.own,amount),borrow=amount-own;window.pendingPayment={amount,recipient:String(data.get('recipient'))};showModal('Проверьте платёж',`<p>${esc(data.get('recipient'))}</p><div class="amount" style="margin-top:20px">${money(amount)}</div><dl class="facts payment-breakdown"><div><dt>Ваши средства</dt><dd>${money(own)}</dd></div><div><dt>Из резерва</dt><dd>${money(borrow)}</dd></div><div><dt>Доступный резерв после</dt><dd>${money(r.limit-r.debt-borrow)}</dd></div><div><dt>Комиссия за платёж</dt><dd>0 ₽ в примере</dd></div></dl>${borrow?'<div class="note amber">На заёмную часть действует 18% годовых в этом примере. Погашение — в течение 30 дней. При возврате в тот же день проценты в демо равны 0 ₽.</div>':'<div class="note green">Собственных средств достаточно. Резерв не используется.</div>'}<div style="margin-top:24px">${btn('Подтвердить платёж','confirm-payment')}</div><p class="small muted">Реального списания не будет.</p>`)}else if(f.id==='income-form'){const amount=Number(data.get('amount'));if(!Number.isSafeInteger(amount)||amount<=0)return;const r=state.reserve,repay=Math.min(amount,r.debt);r.debt-=repay;r.own+=amount-repay;r.events.unshift({kind:'income',title:'Поступление на счёт',detail:'Погашение резерва: '+money(repay),amount,reserve:repay});save();render();toast('Поступление смоделировано. Погашено '+money(repay))}else if(f.classList.contains('bank-form')){const a=state.apps.find(a=>a.id===Number(f.dataset.id));if(!a||a.status!=='manual_review')return;const comment=String(data.get('comment')).trim();if(!comment){toast('Введите комментарий к решению');return}a.status=String(data.get('decision'));a.comment=comment;save();render();toast('Решение сотрудника сохранено')}});
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0);document.getElementById('main').focus({preventScroll:true})});
document.getElementById('modal').addEventListener('close',()=>window.pendingPayment=null);
render();
</script>
</body>
</html>
